appId: com.avikcreator.sidecar
productName: Sidecar
copyright: Copyright © Avik-creator
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
compression: normal
mac:
  category: public.app-category.developer-tools
  identity: null
  extendInfo:
    LSUIElement: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
win:
  target: []
linux:
  target: []
